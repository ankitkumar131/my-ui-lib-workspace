<div class="command-input-wrapper">
  <svg 
    class="command-input-icon" 
    xmlns="http://www.w3.org/2000/svg" 
    width="16" 
    height="16" 
    viewBox="0 0 24 24" 
    fill="none" 
    stroke="currentColor" 
    stroke-width="2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  >
    <circle cx="11" cy="11" r="8"></circle>
    <path d="m21 21-4.35-4.35"></path>
  </svg>
  <input
    #inputElement
    type="text"
    class="command-input"
    [placeholder]="placeholder"
    [value]="searchValue"
    (input)="onInput($event)"
    autocomplete="off"
    autocorrect="off"
    spellcheck="false"
  />
</div>
